name: MLProject CI Retraining and Docker Build

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'MLProject/**'
  workflow_dispatch:

jobs:
  retrain-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12.7'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mlflow==2.19.0 pandas scikit-learn numpy

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Run MLProject Retraining
      run: |
        # Run MLproject in local environment mode (without creating conda env in CI to save time)
        cd MLProject
        mlflow run . --no-conda -P n_estimators=120 -P max_depth=8
        
    - name: Extract Run ID and Build Docker Image
      run: |
        # Find the latest run ID in mlruns
        # Look for the latest created run directory under mlruns/
        # MLProject creates folders with run IDs in mlruns/
        # We can extract it via python script
        cd MLProject
        RUN_ID=$(python -c "
        import os
        import glob
        # Find directories inside mlruns experiment folders
        runs = []
        for exp in glob.glob('mlruns/*'):
            if os.path.isdir(exp) and os.path.basename(exp).isdigit():
                for run in glob.glob(os.path.join(exp, '*')):
                    if os.path.isdir(run) and len(os.path.basename(run)) == 32:
                        runs.append((os.path.getmtime(run), os.path.basename(run)))
        if runs:
            runs.sort()
            print(runs[-1][1])
        else:
            print('default')
        ")
        echo "Latest MLflow Run ID: $RUN_ID"
        
        if [ "$RUN_ID" != "default" ]; then
          # Build Docker Image using MLflow
          mlflow models build-docker -m "mlruns/0/$RUN_ID/artifacts/model" -n "${{ secrets.DOCKERHUB_USERNAME }}/diabetes-classifier:latest"
          
          # Push to Docker Hub
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/diabetes-classifier:latest"
        else
          echo "No active MLflow runs found, skipping docker build."
        fi
